name: Build and Deploy Marp Slides

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Marp CLI and Mermaid renderer
        run: |
          npm install -g @marp-team/marp-cli marked
          npm install

      - name: Build Marp slides
        run: |
          mkdir -p dist
          cp -r docs/* dist/

          for file in docs/seances/*/cours_seance_*.md; do
            if [ -f "$file" ]; then
              out="dist/${file#docs/}"
              out="${out%.md}.html"
              mkdir -p "$(dirname "$out")"
              marp "$file" --html --theme docs/themes/isib.css -o "$out"
            fi
          done

      - name: Build exercise pages (Markdown to static HTML)
        run: |
          for file in docs/seances/*/taches_seance_*.md; do
            if [ -f "$file" ]; then
              out="dist/${file#docs/}"
              out="${out%.md}.html"
              mkdir -p "$(dirname "$out")"

              body="$(marked "$file")"
              session_num="${file##*_seance_}"
              session_num="${session_num%.md}"
              session_num=$((10#$session_num))
              page_title="Séance ${session_num} — Tâches"
              cat > "$out" <<EOF
          <!doctype html>
          <html lang="fr">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>${page_title}</title>
              <link rel="stylesheet" href="../../themes/pages.css" />
            </head>
            <body class="page-flat">
          $body
            </body>
          </html>
          EOF
            fi
          done

      - name: Render Mermaid diagrams to SVG
        run: node scripts/render-mermaid.mjs dist

      - name: Build syllabus page from docs/syllabus.md
        run: |
          body="$(marked docs/syllabus.md)"
          cat > dist/syllabus.html <<EOF
          <!doctype html>
          <html lang="fr">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>Syllabus - Outils Info & IA</title>
              <link rel="stylesheet" href="themes/pages.css" />
            </head>
            <body class="page-flat">
          $body
            </body>
          </html>
          EOF
          rm -f dist/syllabus.md

      - name: Build landing page from docs/index.md
        run: |
          sed -E \
            -e 's#(seances/[0-9]{2}/cours_seance_[0-9]{2})\.md#\1.html#g' \
            -e 's#(seances/[0-9]{2}/taches_seance_[0-9]{2})\.md#\1.html#g' \
            -e 's#\((syllabus)\.md\)#(\1.html)#g' \
            docs/index.md > /tmp/pages-index.md

          body="$(marked /tmp/pages-index.md)"

          cat > dist/index.html <<EOF
          <!doctype html>
          <html lang="fr">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>Outils Info & IA — ISIB</title>
              <link rel="stylesheet" href="themes/pages.css" />
            </head>
            <body class="page-home">
          $body
            </body>
          </html>
          EOF

          rm -f dist/index.md

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
